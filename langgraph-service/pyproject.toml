[project]
name = "bigboy-langgraph-service"
version = "0.1.0"
description = "Standalone LangGraph research agent (functional @entrypoint API) for bigboy-project."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-aws>=1.0.0",
    "python-decouple>=3.8",
    "pydantic-settings>=2.6.0",
]
